<!DOCTYPE html>
<html>

<head>
    <title>User Dashboard</title>

    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            width: 220px;
            text-align: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

    </style>
</head>

<body>

    <h1>User Dashboard</h1>

    <!-- Statistics Cards -->
    <div class="stats">

        <div class="card">
            <h3>Total Posts</h3>
            <p id="total-posts">0</p>
        </div>

        <div class="card">
            <h3>Comments Made</h3>
            <p id="total-comments">0</p>
        </div>

        <div class="card">
            <h3>Likes Received</h3>
            <p id="total-likes">0</p>
        </div>
        <div class="card">
    <h3>Total Views</h3>
    <p id="total-views">0</p>
</div>

    </div>

    <!-- Chart Section -->
    <div class="chart-container">

        <h2>Post Analytics</h2>

        <canvas id="postChart"></canvas>

    </div>

    <script>

        // Dashboard API URL
        const API_URL =
            "http://127.0.0.1:8000/dashboard/";

        // Chart Data API URL
        const CHART_API_URL =
            "http://127.0.0.1:8000/dashboard/chart-data";

        // JWT token localStorage-la irundhu edukkrom
        const token =
            localStorage.getItem("access_token");

        // Token check pannrom
        if (!token) {

            alert(
                "Please login first."
            );

        } else {

            // Dashboard Statistics API Call
            fetch(API_URL, {

                headers: {
                    "Authorization":
                        "Bearer " + token
                }

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Dashboard API Failed"
                    );

                }

                return response.json();

            })

            .then(data => {

                // Statistics display pannrom
                document.getElementById(
                    "total-posts"
                ).textContent =
                    data.total_posts;

                document.getElementById(
                    "total-comments"
                ).textContent =
                    data.total_comments;

                document.getElementById(
                    "total-likes"
                ).textContent =
                    data.total_likes_received;
                
                document.getElementById(
                        "total-views"
                    ).textContent =
                        data.total_views;

            })

            .catch(error => {

                console.error(
                    "Dashboard Error:",
                    error
                );

            });


            // Chart Data API Call
            fetch(CHART_API_URL, {

                headers: {
                    "Authorization":
                        "Bearer " + token
                }

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Chart API Failed"
                    );

                }

                return response.json();

            })

            .then(data => {

                // Titles
                const titles =
                    data.likes.map(
                        item => item.title
                    );

                // Likes
                const likes =
                    data.likes.map(
                        item => item.count
                    );

                // Comments
                const comments =
                    data.comments.map(
                        item => item.count
                    );

                // Chart create pannrom
                const ctx =
                    document.getElementById(
                        "postChart"
                    );

                new Chart(ctx, {

                    type: "bar",

                    data: {

                        labels: titles,

                        datasets: [

                            {
                                label: "Likes",
                                data: likes
                            },

                            {
                                label: "Comments",
                                data: comments
                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        scales: {

                            y: {

                                beginAtZero: true

                            }

                        }

                    }

                });

            })

            .catch(error => {

                console.error(
                    "Chart Error:",
                    error
                );

            });

        }

    </script>

</body>

</html>
