{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup</title>

    <link
        rel="stylesheet"
        href="{% static 'subscriptions/login.css' %}"
    >

</head>


<body>


    <div class="login-container">


        <h2>
            Create Account
        </h2>


        <p>
            Sign up for your account
        </p>


        <form id="signupForm">


            <div class="form-group">

                <label for="username">
                    Name
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Create Account
            </button>


            <p
                id="signupError"
                class="error-message"
            ></p>


        </form>


        <p class="signup-text">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </p>


    </div>


    <script>

        const API_URL =
            "http://127.0.0.1:8000";


        document
            .getElementById("signupForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const errorElement =
                        document
                            .getElementById("signupError");


                    errorElement.textContent = "";


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/auth/signup`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            username:
                                                username,

                                            email:
                                                email,

                                            password:
                                                password

                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            errorElement.textContent =
                                data.detail ||
                                "Signup failed.";

                            return;

                        }


                        alert(
                            "Account created successfully. Please login."
                        );


                        window.location.href =
                            "/login/";

                    }


                    catch (error) {

                        console.error(
                            "Signup Error:",
                            error
                        );


                        errorElement.textContent =
                            "Unable to connect to server.";

                    }

                }
            );

    </script>


</body>

</html>
